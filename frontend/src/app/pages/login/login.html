<div class="auth-container">
    <div class="auth-card">
        
        <div class="auth-header">
            <span class="logo-icon">💰</span>
            <h2>Welcome Back</h2>
            <p>Sign in to your FinanceFlow account</p>
        </div>

        <!-- 👇 LIGAMOS O FORMULÁRIO AQUI 👇 -->
        <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <label for="email">Email</label>
                <!-- Ligar input ao email -->
                <input type="email" id="email" formControlName="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <!-- Ligar input à password -->
                <input type="password" id="password" formControlName="password" placeholder="••••••••">
            </div>

            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>

            <!-- O botão type="submit" vai disparar o (ngSubmit) automaticamente -->
            <button type="submit" class="btn-primary w-100">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
        </div>

    </div>
</div>
